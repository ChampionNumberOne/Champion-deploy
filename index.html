<!-- Скрипт Telegram грузим ТОЛЬКО внутри Telegram. Вне его он не нужен, а при
     недоступном telegram.org (нет сети, блокировка) подвешивал бы запуск. -->
<script>
(function(){
  var tg=false;
  try{
    tg = /tgWebApp/.test(location.hash) || !!window.TelegramWebviewProxy ||
         /tgWebApp/.test(sessionStorage.getItem('__telegram__initParams')||'');
  }catch(e){}
  if(tg) document.write('<script src="https://telegram.org/js/telegram-web-app.js"><\/script>');
})();
</script>
